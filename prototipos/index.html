<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipos · Despachos externos · Nexu</title>
<link rel="stylesheet" href="../design-system/kit.css">
<script src="../design-system/icons.js"></script>
<style>
  .proto-banner{display:flex;gap:10px;align-items:flex-start;background:var(--primary-100);
    border-radius:12px;padding:12px 16px;margin-bottom:20px}
  .proto-banner .ic{color:var(--brand-primary-blue);flex:none;margin-top:1px}
  .proto-banner p{margin:0;font-family:var(--font-body);font-size:13px;line-height:1.5;color:var(--text-base)}
  .proto-banner strong{font-family:var(--font-display)}
  .hub{max-width:960px}
  .hub h1{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0 0 8px}
  .hub .lede{font-family:var(--font-body);font-size:14px;line-height:1.6;color:var(--text-muted);margin:0 0 24px}
  .hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .hub-card{display:block;background:#fff;border-radius:16px;padding:20px;text-decoration:none;color:inherit;
    box-shadow:var(--shadow-sm)}
  .hub-card:hover{box-shadow:var(--shadow-m)}
  .hub-card .who{font-family:var(--font-body);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-subtle);margin:0 0 6px}
  .hub-card h2{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0 0 8px;color:var(--text-base)}
  .hub-card p{font-family:var(--font-body);font-size:13px;line-height:1.5;color:var(--text-muted);margin:0}
  .hub-card .meta{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .read-flag{display:inline-flex;font-family:var(--font-display);font-weight:700;font-size:11px;
    padding:3px 10px;border-radius:9999px;background:var(--gray-100);color:var(--text-muted)}
  .phone{width:360px;background:#fff;border-radius:28px;box-shadow:var(--shadow-m);overflow:hidden;
    border:1px solid var(--gray-200);margin:0 auto}
  .phone-bar{background:#075E54;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  .phone-bar .av{width:36px;height:36px;border-radius:9999px;background:var(--brand-accent-green);
    color:var(--action-navy);display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:12px}
  .phone-bar .nm{font-family:var(--font-display);font-weight:700;font-size:14px}
  .phone-bar .st{font-family:var(--font-body);font-size:11px;opacity:.8}
  .chat{background:#ECE5DD;padding:16px 12px;min-height:480px;display:flex;flex-direction:column;gap:8px}
  .bubble{max-width:82%;padding:8px 12px;border-radius:10px;font-family:var(--font-body);font-size:13px;line-height:1.45}
  .bubble.bot{background:#fff;align-self:flex-start}
  .bubble.me{background:#DCF8C6;align-self:flex-end}
  .bubble .t{font-size:10px;color:var(--text-subtle);text-align:right;margin-top:4px}
  .bubble a.link{color:var(--action-blue);font-family:var(--font-display);font-weight:700;font-size:12.5px}
  .wa-tabs{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
  .timeline{display:flex;flex-direction:column}
  .tl-item{display:grid;grid-template-columns:20px 1fr;gap:14px}
  .tl-item .dotcol{display:flex;flex-direction:column;align-items:center}
  .tl-item .dot{width:12px;height:12px;border-radius:9999px;background:var(--action-blue);margin-top:6px;flex:none}
  .tl-item .line{width:2px;flex:1;background:var(--gray-200);margin:4px 0 0}
  .tl-item:last-child .line{display:none}
  .tl-body{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--gray-100)}
  .tl-body .when{font-family:var(--font-body);font-size:11px;color:var(--text-subtle);margin:0 0 4px}
  .tl-body h3{font-family:var(--font-display);font-weight:700;font-size:14px;margin:0 0 6px}
  .tl-body p{font-family:var(--font-body);font-size:13px;color:var(--text-muted);margin:0;line-height:1.45}
  .hitl-actions{display:flex;gap:10px;justify-content:flex-end}
  .tb-mark{width:22px;height:22px;color:var(--brand-primary-blue);flex:none}
  .tb-mark svg{width:100%;height:100%;display:block}
  .tb-word{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-base);flex:none}
  .page-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .page-head-row p{margin:6px 0 0;font-size:13px;color:var(--text-muted);max-width:560px;line-height:1.5}
  .note-ro{background:var(--warning-100);color:var(--warning-900);border-radius:12px;padding:12px 16px;
    font-family:var(--font-body);font-size:13px;line-height:1.5;margin-bottom:16px}
  .flow-pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;
    font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--text-muted);
    border:none;background:transparent;cursor:pointer}
  .flow-bar{flex:none;background:#fff;border-bottom:1px solid var(--gray-200);padding:var(--space-3) var(--space-5);
    display:flex;flex-direction:column;gap:var(--space-3)}
  .flow-bar-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
  .flow-pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;justify-content:flex-start}
  .flow-pill span{width:20px;height:20px;border-radius:9999px;background:var(--gray-100);display:flex;
    align-items:center;justify-content:center;font-size:11px}
  .flow-pill.on{background:var(--primary-100);color:var(--brand-primary-blue)}
  .flow-pill.on span{background:var(--brand-primary-blue);color:#fff}
  .flow-pill.later{opacity:.7}
  .flow-nav-btns{display:flex;gap:4px;flex:none}
  .flow-nav-btns .icon-btn{text-decoration:none;flex:none}
  .cell-client .nm.nm-link{color:var(--action-blue);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  .asig-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .asig-stats{display:flex;gap:20px;flex:none;flex-wrap:wrap}
  .asig-stats .lab{font-family:var(--font-body);font-size:12px;color:var(--text-muted)}
  .later-banner{background:var(--gray-100);border-radius:12px;padding:12px 16px;margin-bottom:16px;
    font-family:var(--font-body);font-size:13px;color:var(--text-muted)}
  .sources{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  @media (max-width:900px){.hub-grid,.kpi-row,.asig-grid,.sources{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="chrome.js?v=6"></script>
<script>
function tag(label, kind) {
  var bg = "var(--gray-100)", color = "var(--gray-700)";
  if (kind === "ok") { bg = "var(--success-100)"; color = "var(--success-900)"; }
  if (kind === "warn") { bg = "var(--warning-100)"; color = "var(--warning-900)"; }
  if (kind === "err") { bg = "var(--error-100)"; color = "var(--error-900)"; }
  if (kind === "info") { bg = "var(--primary-100)"; color = "var(--brand-primary-blue)"; }
  return '<span class="tag" style="background:' + bg + ";color:" + color + '">' + label + "</span>";
}
function kpi(val, lab) {
  return '<div class="card card-raised kpi"><div class="val">' + val + '</div><div class="lab">' + lab + "</div></div>";
}
function pageHead(title, sub, actions) {
  return '<div class="page-head-row"><div><h1 class="page-title">' + title + "</h1><p>" + sub +
    '</p></div><div class="row gap12">' + (actions || "") + "</div></div>";
}
function av(name) {
  return name.split(" ").map(function (w) { return w[0]; }).slice(0, 2).join("");
}
function cliCell(name) {
  return '<div class="cell-client" data-cliente="' + name + '" style="cursor:pointer"><div class="av">' + av(name) + '</div><div><div class="nm nm-link">' + name + "</div></div></div>";
}
function bindExpedienteClicks(root) {
  root.querySelectorAll(".cell-client[data-cliente]").forEach(function (el) {
    el.addEventListener("click", function (e) {
      e.stopPropagation();
      window.__expCliente = el.getAttribute("data-cliente");
      NexuProto.go("expediente");
    });
  });
}

function renderHub() {
  NexuProto.go("whatsapp");
}

/* 1. Solicitud */
function renderSolicitud(el) {
  el.innerHTML =
    pageHead(
      "Solicitar gestión externa",
      "José Armando Cruz está en BKT 2. Edwin ya agotó teléfono y referencias. La solicitud entra al pool de Ara; no se asigna sola.",
      ""
    ) +
    '<div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' +
    '<div class="card card-raised">' +
    '<p class="eyebrow">Cliente</p>' +
    '<div class="cell-client" style="margin:10px 0 16px"><div class="av">JA</div><div><div class="nm">José Armando Cruz</div><div class="id">NX-09811 · Monterrey</div></div></div>' +
    '<div class="field-grid">' +
    field("Bucket", "BKT 2 · 47 días") +
    field("Saldo", "$94,200") +
    field("Gestor interno", "Edwin López") +
    field("Intentos de contacto", "8 llamadas · 3 refs") +
    "</div></div>" +
    '<div class="card card-raised">' +
    '<p class="card-title">Motivo de la visita</p>' +
    '<div class="form-field" style="margin:14px 0"><label>Razón</label><div class="control"><select><option>Sin contacto tras intentos razonables</option><option>Cliente pidió que pasaran por la unidad</option><option>Sospecha de fraude / domicilio falso</option></select></div></div>' +
    '<div class="form-field"><label>Nota para Ara</label><div class="control"><input value="No contesta desde el 4 ago. La hermana colgó. Pedimos visita en Apodaca."></div></div>' +
    '<div class="row gap12" style="margin-top:18px;justify-content:flex-end">' +
    '<button type="button" class="btn btn-secondary">Cancelar</button>' +
    '<a class="btn btn-primary" href="#" data-go="pool">Enviar al pool</a></div>' +
    '<p class="card-sub" style="margin-top:14px">Buckets 1 a 4 solo salen a externo si alguien lo pide o Ara lo mete. BKT 4+ entra solo, sin esta solicitud.</p>' +
    "</div></div>";
}

/* 2. Pool */
function renderPool(el) {
  el.innerHTML =
    pageHead(
      "Pool de elegibilidad",
      "Aquí se juntan las dos entradas. Ara tiene control total: qué sí pasa a asignación y qué se queda.",
      '<button type="button" class="btn btn-primary" data-go="preparar">Preparar asignación</button>'
    ) +
    '<div class="sources">' +
    '<div class="card card-raised"><p class="eyebrow">Entrada A</p><p class="card-title">Solicitud desde CC</p>' +
    '<p class="card-sub">Gestor interno pide visita en BKT 1–4. Ara aprueba o rechaza. 12 este corte.</p></div>' +
    '<div class="card card-raised"><p class="eyebrow">Entrada B</p><p class="card-title">Elegible directo</p>' +
    '<p class="card-sub">Todo cliente en BKT 4 o más entra solo al pool. 202 este corte. Ara puede sacarlos.</p></div>' +
    "</div>" +
    '<div class="kpi-row" style="grid-template-columns:repeat(3,1fr)">' +
    kpi("214", "En el pool") +
    kpi("12", "Solicitudes BKT 1–4") +
    kpi("202", "BKT 4+ directo") +
    "</div>" +
    '<div class="tabs" style="margin-bottom:16px">' +
    '<button type="button" class="on">Todas <span class="count">214</span></button>' +
    '<button type="button">Solicitudes <span class="count">12</span></button>' +
    '<button type="button">BKT 4+ directo <span class="count">202</span></button>' +
    '<button type="button">Fuera / no asignar <span class="count">28</span></button></div>' +
    '<div class="card card-raised" style="padding:0;overflow:auto"><table class="table"><thead><tr>' +
    "<th></th><th>Cliente</th><th>Origen</th><th>Bucket</th><th>Saldo</th><th>Plaza</th><th>Decisión</th>" +
    "</tr></thead><tbody>" +
    poolRow(true, "José Armando Cruz", "Solicitud · Edwin", "BKT 2", "$94,200", "Monterrey", "info") +
    poolRow(true, "María Elena López", "BKT 4+ directo", "BKT 8", "$186,400", "Guadalajara", "ok") +
    poolRow(true, "Lucía Ramírez Soto", "BKT 4+ directo", "BKT 11", "$241,090", "CDMX Oriente", "ok") +
    poolRow(false, "Carlos Méndez", "BKT 4+ directo", "BKT 4", "$41,800", "Monterrey", "warn") +
    "</tbody></table></div>";
  bindExpedienteClicks(el);
}
function poolRow(checked, name, origin, bkt, saldo, plaza, kind) {
  return "<tr><td><span class=\"ck" + (checked ? " on" : "") + "\"><span class=\"ic\">" +
    NexuProto.ic("check", 13) + "</span></span></td>" +
    '<td>' + cliCell(name) + "</td><td>" + tag(origin, kind) + "</td><td>" + tag(bkt, "info") +
    '</td><td class="td-num">' + saldo + "</td><td>" + plaza + "</td><td>" +
    (checked ? tag("Pasa a asignación", "ok") : tag("Se queda", "warn")) + "</td></tr>";
}

/* 3. Preparar asignación */
function tg(on) {
  return '<button type="button" class="tg' + (on ? " on" : "") + '" aria-checked="' + (on ? "true" : "false") + '"></button>';
}
function renderPreparar(el) {
  el.innerHTML =
    pageHead(
      "Preparar la asignación",
      "Ara marca despachos activos y visitadores internos de Nexu (CDMX y alrededores). Con esa lista, la lógica reparte las cuentas del pool.",
      '<button type="button" class="btn btn-primary" data-go="asignacion">Asignar cuentas</button>'
    ) +
    '<div class="kpi-row" style="grid-template-columns:repeat(3,1fr)">' +
    kpi("214", "Del pool") +
    kpi("4", "Proveedores activos") +
    kpi("5", "Visitadores Nexu activos") +
    "</div>" +
    '<div class="sources">' +
    '<div class="card card-raised" style="padding:0;overflow:auto">' +
    '<div class="row between" style="padding:16px 16px 8px;gap:8px"><p class="card-title" style="margin:0">Proveedores</p>' +
    '<button type="button" class="btn btn-tertiary btn-sm"><span class="ic">' + NexuProto.ic("add", 16) +
    "</span> Agregar proveedor</button></div>" +
    '<table class="table"><thead><tr><th>Proveedor</th><th>Cobertura</th><th>Visitadores</th><th>Activo</th></tr></thead><tbody>' +
    provRow("Seprocob", "Occidente", "8", true) +
    provRow("AVI", "Norte", "5", true) +
    provRow("Opus", "CDMX / Bajío", "6", true) +
    provRow("Recoup", "Sureste", "5", true) +
    provRow("GRC", "Bajío", "3", false) +
    "</tbody></table></div>" +
    '<div class="card card-raised" style="padding:0;overflow:auto">' +
    '<div class="row between" style="padding:16px 16px 8px;gap:8px"><p class="card-title" style="margin:0">Visitadores Nexu</p>' +
    '<button type="button" class="btn btn-tertiary btn-sm"><span class="ic">' + NexuProto.ic("add", 16) +
    "</span> Agregar visitador</button></div>" +
    '<table class="table"><thead><tr><th>Visitador</th><th>Cobertura</th><th>Activo</th></tr></thead><tbody>' +
    visRow("Marco Hernández", "CDMX Centro", true) +
    visRow("Daniela Vega", "CDMX Sur", true) +
    visRow("Iván Trejo", "Edo. Méx. · Naucalpan", true) +
    visRow("Sofía Lara", "Edo. Méx. · Ecatepec", true) +
    visRow("Alejandra Pineda", "Morelos · Cuernavaca", true) +
    visRow("René Campos", "CDMX Oriente", false) +
    "</tbody></table></div></div>" +
    '<div class="card card-raised" style="padding:0;overflow:auto;margin-top:14px">' +
    '<div class="row between" style="padding:16px;gap:12px;flex-wrap:wrap">' +
    '<p class="card-title" style="margin:0">Pool de clientes</p>' +
    '<div class="searchbar"><span class="ic">' + NexuProto.ic("search", 18) +
    '</span><input type="search" id="prep-search" placeholder="Buscar cliente, ciudad o estado"></div></div>' +
    '<table class="table"><thead><tr><th>Cliente</th><th>Origen</th><th>Bucket</th><th>Saldo</th><th>Ciudad, Estado</th><th>Asignar a</th><th></th></tr></thead>' +
    '<tbody id="prep-pool-body"></tbody></table></div>' +
    '<p class="card-sub" style="margin-top:14px">Si no los asignas a mano, quedan en asignación automática al pulsar Asignar cuentas. Quitar del pool los saca de esta corrida.</p>';
  bindPrepPool(el);
}
function provRow(name, zona, n, on) {
  return "<tr><td style=\"font-family:var(--font-display);font-weight:700\">" + name + "</td><td>" + zona +
    '</td><td class="td-num">' + n + "</td><td>" + tg(on) + "</td></tr>";
}
function visRow(name, plaza, on) {
  return "<tr><td>" + name + "</td><td>" + plaza + "</td><td>" + tg(on) + "</td></tr>";
}
var PREP_ASSIGNEES = [
  { v: "", label: "Asignación automática" },
  { group: "Visitadores Nexu", items: [
    { v: "Marco Hernández · Nexu", label: "Marco Hernández · CDMX Centro" },
    { v: "Daniela Vega · Nexu", label: "Daniela Vega · CDMX Sur" },
    { v: "Iván Trejo · Nexu", label: "Iván Trejo · Naucalpan" },
    { v: "Sofía Lara · Nexu", label: "Sofía Lara · Ecatepec" },
    { v: "Alejandra Pineda · Nexu", label: "Alejandra Pineda · Cuernavaca" },
  ]},
  { group: "Despachos", items: [
    { v: "Seprocob", label: "Seprocob · Occidente" },
    { v: "AVI", label: "AVI · Norte" },
    { v: "Opus", label: "Opus · CDMX / Bajío" },
    { v: "Recoup", label: "Recoup · Sureste" },
  ]},
];
var PREP_POOL_SEED = [
  { id: "1", name: "José Armando Cruz", origin: "Solicitud · Edwin", bkt: "BKT 2", saldo: "$94,200", plaza: "Monterrey, N.L." },
  { id: "2", name: "María Elena López", origin: "BKT 4+ directo", bkt: "BKT 8", saldo: "$186,400", plaza: "Guadalajara, Jal." },
  { id: "3", name: "Lucía Ramírez Soto", origin: "BKT 4+ directo", bkt: "BKT 11", saldo: "$241,090", plaza: "Iztapalapa, CDMX" },
  { id: "4", name: "Carlos Méndez", origin: "BKT 4+ directo", bkt: "BKT 4", saldo: "$41,800", plaza: "Monterrey, N.L." },
  { id: "5", name: "Ana Patricia Gil", origin: "BKT 4+ directo", bkt: "BKT 7", saldo: "$128,550", plaza: "León, Gto." },
  { id: "6", name: "Roberto Salinas", origin: "Solicitud · Edwin", bkt: "BKT 3", saldo: "$72,400", plaza: "Querétaro, Qro." },
];
function prepPoolRow(c) {
  var opts = "";
  PREP_ASSIGNEES.forEach(function (o) {
    if (o.group) {
      opts += '<optgroup label="' + o.group + '">';
      o.items.forEach(function (item) {
        opts += "<option value=\"" + item.v + "\"" + (c.asignado === item.v ? " selected" : "") + ">" + item.label + "</option>";
      });
      opts += "</optgroup>";
    } else {
      opts += "<option value=\"" + o.v + "\"" + (c.asignado === o.v ? " selected" : "") + ">" + o.label + "</option>";
    }
  });
  return "<tr><td>" + cliCell(c.name) +
    "</td><td>" + c.origin + "</td><td>" + tag(c.bkt, "info") +
    '</td><td class="td-num">' + c.saldo + "</td><td>" + c.plaza + "</td>" +
    '<td><div class="control"><select class="prep-assign" data-id="' + c.id + '">' + opts + "</select></div></td>" +
    '<td><button type="button" class="btn btn-tertiary btn-sm prep-remove" data-id="' + c.id + '">Quitar del pool</button></td></tr>';
}
function bindPrepPool(el) {
  var pool = PREP_POOL_SEED.map(function (c) { return { id: c.id, name: c.name, origin: c.origin, bkt: c.bkt, saldo: c.saldo, plaza: c.plaza, asignado: "", out: false }; });
  var search = el.querySelector("#prep-search");
  function paint() {
    var q = (search && search.value ? search.value : "").toLowerCase().trim();
    var rows = pool.filter(function (c) {
      if (c.out) return false;
      if (!q) return true;
      return (c.name + " " + c.plaza + " " + c.origin).toLowerCase().indexOf(q) !== -1;
    });
    var tbody = el.querySelector("#prep-pool-body");
    if (!tbody) return;
    tbody.innerHTML = rows.length
      ? rows.map(prepPoolRow).join("")
      : '<tr><td colspan="7"><p class="card-sub" style="margin:12px 0">Ningún cliente con esa búsqueda.</p></td></tr>';
    tbody.querySelectorAll(".prep-remove").forEach(function (btn) {
      btn.addEventListener("click", function () {
        pool.forEach(function (c) { if (c.id === btn.getAttribute("data-id")) c.out = true; });
        paint();
      });
    });
    tbody.querySelectorAll(".prep-assign").forEach(function (sel) {
      sel.addEventListener("change", function () {
        pool.forEach(function (c) { if (c.id === sel.getAttribute("data-id")) c.asignado = sel.value; });
      });
    });
    bindExpedienteClicks(tbody);
  }
  if (search) search.addEventListener("input", paint);
  paint();
}

/* 4. Qué trae cada uno */
function estatusKind(s) {
  if (s === "Al corriente") return "ok";
  if (s === "Sin gestión") return "err";
  if (s === "Promesa de pago" || s === "Dación") return "warn";
  return "info";
}
var ASIG = {
  seprocob: { kind: "Despacho", name: "Seprocob", zona: "Occidente", cuentas: "62", monto: "$1.12M", rec: "$124k", pct: 11.1, vis: "41", ptp: "8", dac: "6", sin: "12",
    clients: [

function periodoRango(startStr) {
  var s = new Date(startStr + "T00:00:00");
  var e = new Date(s);
  e.setDate(e.getDate() + 30);
  function fmt(d) {
    return d.toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
  }
  function iso(d) {
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  return { start: startStr, end: iso(e), label: fmt(s) + " – " + fmt(e), dias: 30 };
}
function periodoCard(startStr) {
  var r = periodoRango(startStr);
  return '<div class="card card-raised" style="margin-bottom:18px"><div class="row between" style="flex-wrap:wrap;gap:16px;align-items:flex-end">' +
    '<div><p class="eyebrow">Periodo en gestión</p><p class="card-title" style="margin:4px 0 0" id="asig-periodo-lbl">' + r.label +
    '</p><p class="card-sub" style="margin:6px 0 0">Aprox. un mes. La asignación puede hacerse cualquier día; el periodo corre desde esa fecha.</p></div>' +
    '<div class="row gap16" style="flex-wrap:wrap;align-items:flex-end">' +
    '<div class="form-field"><label>Inicio</label><div class="control"><span class="ic">' + NexuProto.ic("calendar", 20) +
    '</span><input type="date" id="asig-inicio" value="' + r.start + '"></div></div>' +
    '<div class="form-field"><label>Cierre</label><div class="control"><span class="ic">' + NexuProto.ic("calendar", 20) +
    '</span><input type="date" id="asig-cierre" value="' + r.end + '"></div></div>' +
    tag("30 días", "info") +
    "</div></div></div>";
}
function bindPeriodo(el) {
  var inicio = el.querySelector("#asig-inicio");
  var cierre = el.querySelector("#asig-cierre");
  var lbl = el.querySelector("#asig-periodo-lbl");
  if (!inicio || !cierre) return;
  function syncFromStart() {
    var r = periodoRango(inicio.value);
    window.__asigPeriodo = inicio.value;
    cierre.value = r.end;
    if (lbl) lbl.textContent = r.label;
  }
  function syncLabel() {
    var s = new Date(inicio.value + "T00:00:00");
    var e = new Date(cierre.value + "T00:00:00");
    if (lbl) lbl.textContent = s.toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" }) +
      " – " + e.toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
  }
  inicio.addEventListener("change", syncFromStart);
  cierre.addEventListener("change", syncLabel);
}
function pctKind(pct) {

function firstStep() {
  return (window.NexuProto && NexuProto.FLOW && NexuProto.FLOW[0] && NexuProto.FLOW[0].id) || "whatsapp";
}

var deckStartApplied = false;
function renderRoute() {
  var first = firstStep();
  var id = (location.hash || "#").replace("#", "");
  var start = new URLSearchParams(location.search).get("start");
  if (id === "progreso") id = "asignacion";
  if (!deckStartApplied && start) {
    deckStartApplied = true;
    if (start === "agente" || start === "1") id = first;
    else if (SCREENS[start]) id = start;
    history.replaceState(null, "", location.pathname + "#" + id);
  } else if (!id || !SCREENS[id]) {
    id = first;
    history.replaceState(null, "", location.pathname + "#" + id);
  }
  var s = SCREENS[id];
  var el = NexuProto.mount({ role: s.role, active: s.active, title: s.title, banner: s.banner, flowId: s.flowId });
  s.render(el);
  NexuProto.bind(el);
}
window.renderRoute = renderRoute;
window.addEventListener("hashchange", renderRoute);
renderRoute();
